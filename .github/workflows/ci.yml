# libjhasm CI（Linux + Windows）
#
# 范围：libjhasm 静态库 + 往返冒烟（libjhasm_smoke，assemble/analyze/文本稳定/
# 字节幂等）。依赖：libca 走 luiox-repo git 直连包（CI 显式注册）；libjbc 是
# 仓内联包定义（xmake/packages/libjbc.lua），无需注册。模式对齐 luiox/libjbc/mjt 仓 CI。

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (引用门禁 + Sphinx + Doxygen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        # 钉死本地实测通过的版本：-W 下警告集合随 Sphinx 小版本变，范围安装等于定时炸；升级随文档批次显式改这一行。
        run: python -m pip install --upgrade "sphinx==9.1.1"

      - name: Reference gate (check_refs)
        run: python doc/check_refs.py .

      # -E：增量缓存会跳过「回到旧状态」的文件，警告随之消失，等于没门禁。
      - name: "Build design docs (-W: 警告即失败)"
        run: sphinx-build -b html -E -W --keep-going doc doc/_build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: .-doc-html
          path: doc/_build
          retention-days: 14

      # 微观层：Doxygen 只吃头文件 /// 注释，与 RST 站互不干涉。
      # 版本必须钉死（与本地实测同版）：Doxyfile 的 WARN_* 档随版本增减标签，
      # 老版本会把「不认识的标签」报成告警，WARN_AS_ERROR 下直接变红。
      - name: Install Doxygen (pinned 1.18.0)
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz -o /tmp/dox.tar.gz
          mkdir -p "$HOME/doxygen"
          tar xzf /tmp/dox.tar.gz -C "$HOME/doxygen" --strip-components=1
          test -x "$HOME/doxygen/bin/doxygen"
          echo "$HOME/doxygen/bin" >> "$GITHUB_PATH"

      # GITHUB_PATH 的追加不回灌当前步，PATH 自本步起生效；版本打印放这里。
      - name: Build API docs (WARN_AS_ERROR)
        run: |
          doxygen --version
          doxygen doc/Doxyfile

      - name: Upload API site
        uses: actions/upload-artifact@v4
        with:
          name: .-doc-apidoc
          path: doc/_apidoc/html
          retention-days: 14

  build-linux:
    name: build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libjhasm-xrepo-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libjhasm-xrepo-linux-x64-xmake309-

      - name: Register luiox-repo
        run: xmake repo --add luiox-repo https://github.com/luiox/luiox-repo.git

      - name: Configure
        run: xmake f -p linux -y

      - name: Build
        run: xmake build -y libjhasm

      - name: Smoke (round-trip)
        run: |
          xmake f -p linux --with_smoke=y -y
          xmake build -y libjhasm_smoke
          xmake run libjhasm_smoke "$(pwd)/test/smoke/corpus/test_class.class"

  build-windows:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake/packages
          key: libjhasm-xrepo-windows-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libjhasm-xrepo-windows-x64-xmake309-

      - name: Register luiox-repo
        shell: bash
        run: xmake repo --add luiox-repo https://github.com/luiox/luiox-repo.git

      - name: Configure
        shell: bash
        run: xmake f -p windows -y

      - name: Build
        shell: bash
        run: xmake build -y libjhasm

      - name: Smoke (round-trip)
        shell: bash
        run: |
          xmake f -p windows --with_smoke=y -y
          xmake build -y libjhasm_smoke
          xmake run libjhasm_smoke "$(pwd)/test/smoke/corpus/test_class.class"
